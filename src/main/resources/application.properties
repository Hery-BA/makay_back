# Application
spring.application.name=makay

# Server
server.port=${PORT:8080}

# Réduire les threads Tomcat (défaut 200 ? trop pour un petit projet)
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Hikari - réduit pour économiser la RAM
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# Lazy initialization
spring.main.lazy-initialization=true

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Resend Email
resend.api-key=${RESEND_API_KEY:your_resend_key}
resend.from-email=contact@makay-adventures.com
resend.to-email=${ADMIN_EMAIL:admin@makay-adventures.com}

# CORS
cors.allowed-origins=${FRONTEND_URL}

# WhatsApp
whatsapp.phone.admin=${ADMIN_PHONE}

# Logging - IMPORTANT : désactiver DEBUG en prod, ça consomme de la mémoire
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.org.springframework.boot.autoconfigure.flyway=WARN
logging.level.org.springframework.jdbc=WARN